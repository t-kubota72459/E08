<svg xmlns="http://www.w3.org/2000/svg" width="920" height="250" viewBox="0 0 920 250">
  <style>
    .g{fill:white;stroke:#111;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .w{fill:none;stroke:#111;stroke-width:3;stroke-linecap:round}
    .t{font-family:"Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif;font-size:22px;fill:#111}
    .s{font-family:"Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif;font-size:18px;fill:#111}
  </style>
  <!-- AND -->
  <text x="95" y="28" class="t" text-anchor="middle">AND</text>
  <line x1="20" y1="82" x2="55" y2="82" class="w"/><line x1="20" y1="132" x2="55" y2="132" class="w"/>
  <path d="M55 55 L100 55 A52 52 0 0 1 100 159 L55 159 Z" class="g"/>
  <line x1="152" y1="107" x2="190" y2="107" class="w"/>
  <text x="105" y="205" class="s" text-anchor="middle">両方1 → 1</text>
  <!-- OR -->
  <text x="315" y="28" class="t" text-anchor="middle">OR</text>
  <line x1="235" y1="82" x2="275" y2="82" class="w"/><line x1="235" y1="132" x2="275" y2="132" class="w"/>
  <path d="M270 55 Q310 105 270 159 Q335 159 385 107 Q335 55 270 55 Z" class="g"/>
  <line x1="385" y1="107" x2="420" y2="107" class="w"/>
  <text x="325" y="205" class="s" text-anchor="middle">どちらか1 → 1</text>
  <!-- XOR -->
  <text x="545" y="28" class="t" text-anchor="middle">XOR</text>
  <line x1="455" y1="82" x2="505" y2="82" class="w"/><line x1="455" y1="132" x2="505" y2="132" class="w"/>
  <path d="M500 55 Q540 105 500 159 Q565 159 615 107 Q565 55 500 55 Z" class="g"/>
  <path d="M487 55 Q527 105 487 159" class="w"/>
  <line x1="615" y1="107" x2="650" y2="107" class="w"/>
  <text x="555" y="205" class="s" text-anchor="middle">異なる → 1</text>
  <!-- NOT -->
  <text x="780" y="28" class="t" text-anchor="middle">NOT</text>
  <line x1="700" y1="107" x2="740" y2="107" class="w"/>
  <path d="M740 65 L740 149 L815 107 Z" class="g"/>
  <circle cx="825" cy="107" r="10" class="g"/>
  <line x1="835" y1="107" x2="875" y2="107" class="w"/>
  <text x="790" y="205" class="s" text-anchor="middle">0/1を反転</text>
</svg>
